<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-blue { fill: #0077FE; }
      .brand-dark { fill: #071739; }
      .text-estora {
        font-family: 'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif;
        font-weight: 900;
        font-size: 64px;
        letter-spacing: 0.04em;
        fill: #0077FE;
      }
      .text-realestate {
        font-family: 'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 21px;
        letter-spacing: 0.32em;
        fill: #071739;
      }
    </style>
  </defs>

  <!-- ICON / EMBLEM -->
  <g transform="translate(4, 8)">
    <!-- Top Chevron (Bright Blue) -->
    <path class="brand-blue" d="M 68 8 L 132 46 C 134 47 135 49 135 52 L 135 62 C 135 66 130 69 126 66 L 68 32 L 10 66 C 6 69 1 66 1 62 L 1 52 C 1 49 2 47 4 46 Z"/>
    
    <!-- Middle Chevron (Bright Blue) -->
    <path class="brand-blue" d="M 68 40 L 132 78 C 134 79 135 81 135 84 L 135 94 C 135 98 130 101 126 98 L 68 64 L 10 98 C 6 101 1 98 1 94 L 1 84 C 1 81 2 79 4 78 Z"/>

    <!-- Bottom Chevron (Dark Navy) -->
    <path class="brand-dark" d="M 68 76 L 132 114 C 134 115 135 117 135 120 L 135 125 C 135 129 130 132 126 130 L 68 98 L 10 130 C 6 132 1 129 1 125 L 1 120 C 1 117 2 115 4 114 Z"/>
  </g>

  <!-- TEXT BRANDING -->
  <g transform="translate(156, 0)">
    <!-- ESTORA -->
    <text x="0" y="78" class="text-estora">ESTORA</text>
    
    <!-- REAL ESTATE -->
    <text x="3" y="118" class="text-realestate">REAL ESTATE</text>
  </g>
</svg>
